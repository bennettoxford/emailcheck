---
name: CI
permissions:
  contents: read

on:
  push:


# Note: we prefer to pin ubuntu versions explicitly rather than use
# ubuntu:latest, as that changes underneath us.
jobs:
  check:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: opensafely-core/setup-action@1f93a08c6e31a75b0908fcac5d25c2cf729c31f2 # v1.8.0
        with:
          install-uv: true
          install-just: true
          cache: uv
      - name: Check formatting, linting and import sorting
        run: just check

  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: opensafely-core/setup-action@1f93a08c6e31a75b0908fcac5d25c2cf729c31f2 # v1.8.0
        with:
          install-uv: true
          install-just: true
          cache: uv
          python-version: ${{ matrix.python-version }}
      - name: Run tests
        #env:  # Add environment variables required for tests
        run: |
          just test
